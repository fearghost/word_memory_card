name: Android CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission to gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    # ── Debug build ──────────────────────────────────────────────
    - name: Build Debug APK
      run: ./gradlew clean assembleDebug --no-daemon
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Rename & copy Debug APK
      run: |
        mkdir -p artifacts
        cp app/build/outputs/apk/debug/app-debug.apk artifacts/WordMemoryDbg.apk

    - name: Upload Debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: artifacts/WordMemoryDbg.apk

    # ── Release build ────────────────────────────────────────────
    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Generate signing keystore
      run: |
        keytool -genkeypair -v \
          -keystore signing.jks \
          -storepass wordmemory123 \
          -keypass wordmemory123 \
          -alias wordmemory \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=WordMemory, OU=Dev, O=WordMemory, L=Seoul, ST=Gyeonggi, C=KR"

    # ── Sign release APK with apksigner ──────────────────────────
    - name: Install build-tools & sign APK
      run: |
        mkdir -p artifacts
        sdkmanager "build-tools;34.0.0" 2>/dev/null || true
        UNSIGNED=$(find app/build/outputs/apk/release/ -name '*.apk' | head -1)
        /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner sign \
          --ks signing.jks \
          --ks-pass pass:wordmemory123 \
          --ks-key-alias wordmemory \
          --key-pass pass:wordmemory123 \
          "$UNSIGNED"
        cp "$UNSIGNED" artifacts/WordMemory.apk

    - name: Upload Release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: artifacts/WordMemory.apk

    # ── GitHub Release (tag push only) ───────────────────────────
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/WordMemory.apk
        name: ${{ github.ref_name }}
        body: |
          ## WordMemory ${{ github.ref_name }}

          ### Changes
          - OCR flashcard app with AI-powered word parsing
          - Multi-accent TTS (US, UK, AU)
          - Interactive 3D flip cards
          - Bundle management & editing
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
